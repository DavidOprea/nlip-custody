# Custody demo: five agents in three organisations, plus an outside rogue agent.
#
#   acme  (the user's company): user client, assistant, inbox reader
#   fin   (finance provider)  : finance  -- has the `pay` tool
#   hr    (HR provider)       : hr       -- has the `get_salary` tool
#   rogue (third party, runs no Custody): rogue
#
# Paths are relative to this file. Keys are generated on first run into ./keys/
# (git-ignored). `key_file` is used in in-process mode; `signer` (a separate signer
# process) in HTTP mode. The loader keeps exactly one of them.

[custody]
keys_dir = "keys"
log_dir = "logs"

# NLIP entity name -> custody identity, for every entity that runs Custody.
[custody.identities]
user = "agent:acme/user-client"
assistant = "agent:acme/assistant"
inbox = "agent:acme/inbox"
reader = "agent:acme/reader"
finance = "agent:fin/finance"
hr = "agent:hr/hr"

# ---------------------------------------------------------------- entities

[entities.user]
role = "user_client"

[entities.assistant]
host = "127.0.0.1"
port = 8101
endpoint = "http://127.0.0.1:8101/nlip"
[entities.assistant.security]
ingress = ["custody_assistant"]
egress = ["custody_assistant"]

[entities.inbox]
host = "127.0.0.1"
port = 8102
endpoint = "http://127.0.0.1:8102/nlip"
[entities.inbox.security]
ingress = ["custody_inbox"]
egress = ["custody_inbox"]

[entities.finance]
host = "127.0.0.1"
port = 8103
endpoint = "http://127.0.0.1:8103/nlip"
[entities.finance.security]
ingress = ["custody_finance"]
egress = ["custody_finance"]

[entities.hr]
host = "127.0.0.1"
port = 8104
endpoint = "http://127.0.0.1:8104/nlip"
[entities.hr.security]
ingress = ["custody_hr"]
egress = ["custody_hr"]

[entities.reader]
host = "127.0.0.1"
port = 8106
endpoint = "http://127.0.0.1:8106/nlip"
[entities.reader.security]
ingress = ["custody_reader"]
egress = ["custody_reader"]

[entities.rogue]
host = "127.0.0.1"
port = 8105
endpoint = "http://127.0.0.1:8105/nlip"
# no security: the rogue agent does not run Custody

[entities.user.security]
ingress = ["custody_user"]
egress = ["custody_user"]

# ------------------------------------------------- NLIP security extensions
# `peers` and `pinned_keys` are filled in by the loader from [custody.identities]
# and keys/public.json.

[security_extensions.custody_user]
entrypoint = "security_extensions.custody.extension:CustodyExtension"
[security_extensions.custody_user.options]
identity = "agent:acme/user-client"
origin_principals = ["user:h:alice"]
key_file = "keys/agent_acme_user-client.pem"
signer = "tcp:127.0.0.1:47100"
log_path = "logs/user.jsonl"

[security_extensions.custody_assistant]
entrypoint = "security_extensions.custody.extension:CustodyExtension"
[security_extensions.custody_assistant.options]
identity = "agent:acme/assistant"
key_file = "keys/agent_acme_assistant.pem"
signer = "tcp:127.0.0.1:47101"
log_path = "logs/assistant.jsonl"

[security_extensions.custody_inbox]
entrypoint = "security_extensions.custody.extension:CustodyExtension"
[security_extensions.custody_inbox.options]
identity = "agent:acme/inbox"
key_file = "keys/agent_acme_inbox.pem"
signer = "tcp:127.0.0.1:47102"
log_path = "logs/inbox.jsonl"

[security_extensions.custody_finance]
entrypoint = "security_extensions.custody.extension:CustodyExtension"
[security_extensions.custody_finance.options]
identity = "agent:fin/finance"
key_file = "keys/agent_fin_finance.pem"
signer = "tcp:127.0.0.1:47103"
log_path = "logs/finance.jsonl"

[security_extensions.custody_hr]
entrypoint = "security_extensions.custody.extension:CustodyExtension"
[security_extensions.custody_hr.options]
identity = "agent:hr/hr"
key_file = "keys/agent_hr_hr.pem"
signer = "tcp:127.0.0.1:47104"
log_path = "logs/hr.jsonl"

# The sandboxed reader: reads the inbox, calls nobody, returns typed JSON only. Its SE
# endorses a reply that validates against this schema and fills no authority field.
[security_extensions.custody_reader]
entrypoint = "security_extensions.custody.endorse:EndorsingCustodyExtension"
[security_extensions.custody_reader.options]
identity = "agent:acme/reader"
key_file = "keys/agent_acme_reader.pem"
signer = "tcp:127.0.0.1:47105"
log_path = "logs/reader.jsonl"
[security_extensions.custody_reader.options.endorse]
authority_fields = ["invoice"]
[security_extensions.custody_reader.options.endorse.schema]
type = "object"
additionalProperties = false
required = ["messages", "from_known_contacts", "has_invoice", "urgent", "invoice"]
[security_extensions.custody_reader.options.endorse.schema.properties]
messages = { type = "integer", minimum = 0, maximum = 1000 }
from_known_contacts = { type = "integer", minimum = 0, maximum = 1000 }
has_invoice = { type = "boolean" }
urgent = { type = "boolean" }
[security_extensions.custody_reader.options.endorse.schema.properties.invoice]
type = ["object", "null"]
additionalProperties = false
required = ["payee", "account", "amount"]
[security_extensions.custody_reader.options.endorse.schema.properties.invoice.properties]
payee = { type = "string", pattern = "[a-z0-9.-]{1,40}" }
account = { type = "string", pattern = "[0-9]{1,12}" }
amount = { type = "integer", minimum = 0, maximum = 1000000 }

# ------------------------------------------------------- tool-call checks
# `approvers` is filled in by the loader (the user client's public key).

# The assistant's memory outlives conversations: what a task writes keeps that task's
# principals as its authors, and a later task that reads it inherits them.
[custody_guard.assistant]
identity = "agent:acme/assistant"
log_path = "logs/assistant.jsonl"
[custody_guard.assistant.storage.remember]
writes = "key"
namespace = "memory"
[custody_guard.assistant.storage.recall]
reads = "key"
namespace = "memory"

[custody_guard.reader]
identity = "agent:acme/reader"
principal_salt = "acme-demo-salt"
log_path = "logs/reader.jsonl"
[custody_guard.reader.sources.read_inbox]
result_field = "from"

[custody_guard.inbox]
identity = "agent:acme/inbox"
principal_salt = "acme-demo-salt"
log_path = "logs/inbox.jsonl"
[custody_guard.inbox.sources.read_inbox]
result_field = "from"

# Other participating agents that run Custody may be allowed as influencers: whatever
# influenced them travels with their token, so a poisoned HR still shows the email
# sender. The inbox reader is excluded on purpose: its output is outside content.
# The sandboxed reader is allowed as an endorser: a reply it cannot endorse still
# carries the mail senders.
[custody_guard.finance]
identity = "agent:fin/finance"
log_path = "logs/finance.jsonl"
[custody_guard.finance.policy.pay]
allowed = ["user:*", "agent:acme/user-client", "agent:acme/assistant", "agent:acme/reader", "agent:fin/*", "agent:hr/*"]

[custody_guard.hr]
identity = "agent:hr/hr"
log_path = "logs/hr.jsonl"
[custody_guard.hr.policy.get_salary]
allowed = ["user:*", "agent:acme/user-client", "agent:acme/assistant", "agent:acme/reader", "agent:hr/*", "agent:fin/*"]

# ------------------------------------------------------------ baselines
# Used only when the runner selects that defence (see settings.py). Each one reuses
# the custody SE definitions above with one idea changed.

# Per-hop taint (Rule of Two style): tokens authenticate senders but carry no
# principal set; same tool policies; plus "untrusted + sensitive -> no outside send".
[baselines.per_hop]
entrypoint = "security_extensions.baselines.per_hop:PerHopTaintExtension"
sensitive_sources = ["hr"]
outside_destinations = ["rogue"]

# Authority narrowing (Warrant style): the user delegates pay and get_salary to the
# assistant, capped; each provider's own agents also hold them.
[baselines.authority.finance.warrants.pay]
holders = ["agent:acme/assistant", "agent:fin/*"]
max = { amount = 10000 }
[baselines.authority.hr.warrants.get_salary]
holders = ["agent:acme/assistant", "agent:hr/*"]

# Content judge at every door.
[baselines.judge]
entrypoint = "security_extensions.baselines.judge:ContentJudgeExtension"
