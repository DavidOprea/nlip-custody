# AgentDojo banking suite (v1.2.1), split across NLIP agents in two organisations.
#
#   acme (the user's side): user client, assistant, files (read_file: outside documents)
#   bank (the bank's side): bank (accounts and transactions), profile (user account)
#
# Loaded by agent_applications.custody_demo.settings.DemoSettings, like the demo's
# config. Keys go to ./keys/ (git-ignored).

[custody]
keys_dir = "keys"
log_dir = "logs"

[custody.identities]
user = "agent:acme/user-client"
assistant = "agent:acme/assistant"
files = "agent:acme/files"
bank = "agent:bank/bank"
profile = "agent:bank/profile"

[entities.user]
role = "user_client"
[entities.user.security]
ingress = ["custody_user"]
egress = ["custody_user"]

[entities.assistant]
endpoint = "http://assistant.dojo/nlip"
[entities.assistant.security]
ingress = ["custody_assistant"]
egress = ["custody_assistant"]

[entities.files]
endpoint = "http://files.dojo/nlip"
[entities.files.security]
ingress = ["custody_files"]
egress = ["custody_files"]

[entities.bank]
endpoint = "http://bank.dojo/nlip"
[entities.bank.security]
ingress = ["custody_bank"]
egress = ["custody_bank"]

[entities.profile]
endpoint = "http://profile.dojo/nlip"
[entities.profile.security]
ingress = ["custody_profile"]
egress = ["custody_profile"]

[security_extensions.custody_user]
entrypoint = "security_extensions.custody.extension:CustodyExtension"
[security_extensions.custody_user.options]
identity = "agent:acme/user-client"
origin_principals = ["user:h:emma"]
key_file = "keys/agent_acme_user-client.pem"
log_path = "logs/user.jsonl"

[security_extensions.custody_assistant]
entrypoint = "security_extensions.custody.extension:CustodyExtension"
[security_extensions.custody_assistant.options]
identity = "agent:acme/assistant"
key_file = "keys/agent_acme_assistant.pem"
log_path = "logs/assistant.jsonl"

[security_extensions.custody_files]
entrypoint = "security_extensions.custody.extension:CustodyExtension"
[security_extensions.custody_files.options]
identity = "agent:acme/files"
key_file = "keys/agent_acme_files.pem"
log_path = "logs/files.jsonl"

[security_extensions.custody_bank]
entrypoint = "security_extensions.custody.extension:CustodyExtension"
[security_extensions.custody_bank.options]
identity = "agent:bank/bank"
key_file = "keys/agent_bank_bank.pem"
log_path = "logs/bank.jsonl"

[security_extensions.custody_profile]
entrypoint = "security_extensions.custody.extension:CustodyExtension"
[security_extensions.custody_profile.options]
identity = "agent:bank/profile"
key_file = "keys/agent_bank_profile.pem"
log_path = "logs/profile.jsonl"

# --------------------------------------------------------- tool guards
# Outside content: documents in the file store, and transaction subjects, which are
# written by whoever sent the money. The user's own outgoing transactions are not
# outside content.

[custody_guard.files]
identity = "agent:acme/files"
log_path = "logs/files.jsonl"
[custody_guard.files.sources.read_file]
principals = ["external:files"]

[custody_guard.bank]
identity = "agent:bank/bank"
principal_salt = "bank-salt"
log_path = "logs/bank.jsonl"
[custody_guard.bank.sources.get_most_recent_transactions]
result_field = "sender"
ignore_values = ["me", "DE89370400440532013000"]
[custody_guard.bank.policy.send_money]
allowed = ["user:*", "agent:acme/user-client", "agent:acme/assistant", "agent:bank/*"]
[custody_guard.bank.policy.schedule_transaction]
allowed = ["user:*", "agent:acme/user-client", "agent:acme/assistant", "agent:bank/*"]
[custody_guard.bank.policy.update_scheduled_transaction]
allowed = ["user:*", "agent:acme/user-client", "agent:acme/assistant", "agent:bank/*"]

[custody_guard.profile]
identity = "agent:bank/profile"
log_path = "logs/profile.jsonl"
[custody_guard.profile.policy.update_password]
allowed = ["user:*", "agent:acme/user-client", "agent:acme/assistant", "agent:bank/*"]
[custody_guard.profile.policy.update_user_info]
allowed = ["user:*", "agent:acme/user-client", "agent:acme/assistant", "agent:bank/*"]

# ------------------------------------------------------------ baselines

[baselines.per_hop]
entrypoint = "security_extensions.baselines.per_hop:PerHopTaintExtension"
sensitive_sources = []
outside_destinations = []

[baselines.authority.bank.warrants.send_money]
holders = ["agent:acme/assistant", "agent:bank/*"]
max = { amount = 10000 }
[baselines.authority.bank.warrants.schedule_transaction]
holders = ["agent:acme/assistant", "agent:bank/*"]
max = { amount = 10000 }
[baselines.authority.bank.warrants.update_scheduled_transaction]
holders = ["agent:acme/assistant", "agent:bank/*"]
[baselines.authority.profile.warrants.update_password]
holders = ["agent:acme/assistant", "agent:bank/*"]
[baselines.authority.profile.warrants.update_user_info]
holders = ["agent:acme/assistant", "agent:bank/*"]

[baselines.judge]
entrypoint = "security_extensions.baselines.judge:ContentJudgeExtension"
